name: Native desktop checks
on:
  workflow_dispatch:
  push:
    branches: [master, rust-build]
    paths-ignore:
      - "**/*.md"
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    concurrency:
      group: desktop-checks-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build:renderer
      - name: Prepare verified portable AutoHotkey for Windows fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-ahk-ci.ps1
      - if: runner.os != 'macOS'
        run: npm test
      - if: runner.os == 'macOS'
        run: npm run test:renderer
      - name: Compile macOS native tests
        if: runner.os == 'macOS'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-run
      - name: Run macOS native tests
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: npm run test:native
      - run: node --test scripts/release.test.mjs
      - if: runner.os != 'macOS'
        run: npm run build:debug
      - name: Launch and quit the macOS application bundle
        if: runner.os == 'macOS'
        run: |
          npx --no-install tauri build --debug --bundles app -- --locked
          xcrun swift scripts/check-macos-launch.swift "src-tauri/target/debug/bundle/macos/Localhost Dashboard.app"
      - if: runner.os == 'Windows'
        run: node scripts/desktop.integration.mjs
      - if: runner.os == 'Windows'
        run: node scripts/desktop-shell.mjs
      - if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: node scripts/check-dev-launch.mjs

  installed-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    concurrency:
      group: installed-windows-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - name: Build the normal release installer
        run: npm run package -- --bundles nsis -- --locked
      - name: Upgrade the previous Electron release and check the installed Rust app
        shell: pwsh
        run: |
          $stage = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/installer-qa"
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected exactly one release installer.' }
          Copy-Item -LiteralPath $installer[0].FullName -Destination (Join-Path $stage 'Localhost-Dashboard-Setup-qa.exe')
          ./scripts/check-windows-upgrade.ps1 -Stage $stage
      - shell: pwsh
        run: ./scripts/prepare-ahk-ci.ps1
      - name: Exercise Windows shell integration in the installed release
        run: node scripts/desktop-shell.mjs --installed
