name: Native desktop checks
on:
  workflow_dispatch:
  push:
    branches: [master, rust-build]
    paths-ignore:
      - "**/*.md"
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    concurrency:
      group: desktop-checks-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build:renderer
      - name: Prepare verified portable AutoHotkey for Windows fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'AutoHotkey_2.0.19.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'dashboard-ahk-v2'
          Invoke-WebRequest 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip' -OutFile $zip
          if ((Get-FileHash $zip).Hash -ne '4E0D0E65655066A646A210951320FEAEF0729A3597177131ADAEC4066BEF5869') { throw 'AutoHotkey checksum mismatch.' }
          Expand-Archive $zip -DestinationPath $folder
          $exe = Get-Item (Join-Path $folder 'AutoHotkey64.exe')
          "DASHBOARD_QA_AHK_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          $folder >> $env:GITHUB_PATH
      - run: npm test
      - run: node --test scripts/release.test.mjs
      - if: runner.os != 'macOS'
        run: npm run build:debug
      - name: Launch and quit the macOS application bundle
        if: runner.os == 'macOS'
        run: |
          npx --no-install tauri build --debug --bundles app -- --locked
          xcrun swift scripts/check-macos-launch.swift "src-tauri/target/debug/bundle/macos/Localhost Dashboard.app"
      - if: runner.os == 'Windows'
        run: node scripts/desktop.integration.mjs
      - if: runner.os == 'Windows'
        run: node scripts/desktop-shell.mjs
      - name: Exercise the installed Windows app on a disposable runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run package -- --bundles nsis -- --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $stage = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/installer-qa"
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected exactly one release installer.' }
          Copy-Item -LiteralPath $installer[0].FullName -Destination (Join-Path $stage 'Localhost-Dashboard-Setup-qa.exe')
          ./scripts/check-windows-upgrade.ps1 -Stage $stage
          node scripts/desktop-shell.mjs --installed
      - if: runner.os == 'Windows'
        run: node scripts/check-dev-launch.mjs
