name: Release desktop apps

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-date: ${{ steps.date.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: date
        run: echo "value=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Check manifests, feeds, tag ancestry and notes
        env:
          RELEASE_DATE: ${{ steps.date.outputs.value }}
        run: |
          git fetch origin master
          git merge-base --is-ancestor HEAD origin/master
          node scripts/release.mjs validate
          node --test scripts/release.test.mjs
      - name: Create or reuse the unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [[ "$current" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$current" != "$GITHUB_REF_NAME"
          test "$(printf '%s\n' "$current" "$GITHUB_REF_NAME" | sort -V | tail -1)" = "$GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Localhost Dashboard $GITHUB_REF_NAME" --notes-file "$notes"
          fi

  windows:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      RELEASE_DATE: ${{ needs.validate.outputs.release-date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx --no-install tsc --noEmit
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Package and sign the x64 NSIS updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY) { throw "Missing Tauri signing key" }
          node scripts/release.mjs config "$env:RUNNER_TEMP/release.json"
          npx --no-install tauri build --bundles nsis --config "$env:RUNNER_TEMP/release.json" -- --locked
      - name: Stage installer, portable executable and legacy metadata
        run: |
          node scripts/release.mjs stage windows src-tauri/target/release stage-win
          $archive = Join-Path $env:RUNNER_TEMP 'app-builder-bin.tgz'
          Invoke-WebRequest https://registry.npmjs.org/app-builder-bin/-/app-builder-bin-5.0.0-alpha.12.tgz -OutFile $archive
          $digest = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($archive)))
          if ($digest -ne 'j87o0j6LqPL3QRr8yid6c+Tt5gC7xNfYo6uQIQkorAC6MpeayVMZrEDzKmJJ/Hlv7EnOQpaRm53k6ktDYZyB6w==') { throw "Blockmap tool integrity mismatch" }
          tar.exe -xzf $archive -C $env:RUNNER_TEMP package/win/x64/app-builder.exe
          $installer = (Get-ChildItem stage-win/Localhost-Dashboard-Setup-*.exe).FullName
          & "$env:RUNNER_TEMP/package/win/x64/app-builder.exe" blockmap --input $installer --output "$installer.blockmap"
      - name: Upgrade from the last Electron release on the disposable runner
        run: ./scripts/check-windows-upgrade.ps1 -Stage stage-win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: stage-win/
          if-no-files-found: error

  mac:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 120
    env:
      RELEASE_DATE: ${{ needs.validate.outputs.release-date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - run: npm ci
      - run: npx --no-install tsc --noEmit
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build and sign the universal macOS packages
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          node scripts/release.mjs config "$RUNNER_TEMP/release.json"
          npx --no-install tauri build --target universal-apple-darwin --bundles app,dmg --config "$RUNNER_TEMP/release.json" -- --locked
      - name: Verify the universal packages and sign the Sparkle transition
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_ED_PRIVATE_KEY"
          version="${GITHUB_REF_NAME#v}"
          root=src-tauri/target/universal-apple-darwin/release
          node scripts/release.mjs stage mac "$root" stage-mac
          app="$root/bundle/macos/Localhost Dashboard.app"
          minimum=$(node -p "require('./src-tauri/tauri.macos.conf.json').bundle.macOS.minimumSystemVersion")
          check_bundle() {
            local bundle="$1"
            local plist="$bundle/Contents/Info.plist"
            local binary
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = com.localdashboard.app
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$version"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$version"
            test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")" = "$minimum"
            test "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$plist")" = 'pLcjY+xshxhfKvhZyQbg8XZZFmrPzOw+lyVUGkd9JcI='
            binary=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
            lipo "$bundle/Contents/MacOS/$binary" -verify_arch arm64 x86_64
            cmp "$app/Contents/MacOS/$binary" "$bundle/Contents/MacOS/$binary"
            codesign --verify --deep --strict "$bundle"
          }
          check_bundle "$app"
          dmg="stage-mac/Localhost-Dashboard-$version-universal.dmg"
          hdiutil verify "$dmg"
          mount="$RUNNER_TEMP/mounted-dmg"
          mkdir "$mount"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          check_bundle "$mount/Localhost Dashboard.app"
          hdiutil detach "$mount"
          trap - EXIT
          mkdir "$RUNNER_TEMP/unpacked-update"
          tar -xzf "stage-mac/Localhost-Dashboard-$version-universal.app.tar.gz" -C "$RUNNER_TEMP/unpacked-update"
          check_bundle "$RUNNER_TEMP/unpacked-update/Localhost Dashboard.app"
          zip="stage-mac/Localhost-Dashboard-$version-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          ditto -x -k "$zip" "$RUNNER_TEMP/unpacked-sparkle-update"
          check_bundle "$RUNNER_TEMP/unpacked-sparkle-update/Localhost Dashboard.app"
          curl -fsSL https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz -o "$RUNNER_TEMP/sparkle.tar.xz"
          echo "1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 --check
          mkdir "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - "$zip" > "$RUNNER_TEMP/sparkle-signature.txt"
          node scripts/release.mjs sparkle stage-mac "$RUNNER_TEMP/sparkle-signature.txt"
          xmllint --noout stage-mac/appcast.xml
      - uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: stage-mac/
          if-no-files-found: error

  publish:
    needs: [validate, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_DATE: ${{ needs.validate.outputs.release-date }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: stage
          merge-multiple: true
      - name: Verify both platforms, upload to draft, download and verify before publishing
        run: |
          node scripts/release.mjs feed stage
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          gh release upload "$GITHUB_REF_NAME" stage/* --clobber
          gh release download "$GITHUB_REF_NAME" --dir checked
          diff -qr stage checked
          node scripts/release.mjs verify checked
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Verify live update discovery
        run: |
          for feed in latest.json latest.yml appcast.xml; do
            for attempt in 1 2 3 4 5; do
              if curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$feed" -o public-feed && cmp -s "checked/$feed" public-feed; then break; fi
              sleep 10
            done
            cmp "checked/$feed" public-feed
          done
